name: Android APK

on:
  push:
    paths:
      - 'tracker/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RITUAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ritual.jks"
            echo "RITUAL_KEYSTORE=$RUNNER_TEMP/ritual.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Signing secrets aren't set, so this run only checks that the app builds. See the README to publish signed APKs."
          fi

      - name: Build APK
        working-directory: android
        env:
          RITUAL_KEYSTORE_PASSWORD: ${{ secrets.RITUAL_KEYSTORE_PASSWORD }}
        run: RITUAL_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) ./gradlew --no-daemon assembleRelease

      - name: Publish release
        if: env.RITUAL_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.$((100 + GITHUB_RUN_NUMBER))"
          cp android/app/build/outputs/apk/release/app-release.apk Ritual.apk
          gh release create "android-v$version" Ritual.apk \
            --target "$GITHUB_SHA" \
            --title "Ritual for Android $version" \
            --notes "Open this page on your phone, download Ritual.apk and tap it to install. Updates install over the previous version and keep your data."
